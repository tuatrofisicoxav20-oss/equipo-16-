  <script>
/* EstudiandoAndo · Biblioteca interactiva, contenido local demostrativo.
   No realiza solicitudes de red. No pretende acreditar equivalencia con programas oficiales.
   Integrado con TA.state.catalog y los mecanismos de navegación y persistencia existentes. */
(function (TA) {
  'use strict';
  const {html, icon, raw, attr, ui} = TA;
  const C = TA.catalog = {};
  const Q = (stem, options, correct, why, hint, error='') => ({stem,options,correct,why,hint,error});
  const L = (id,title,goal,concept,steps,example,visual,questions,extra={}) => ({id,title,goal,concept,steps,example,visual,questions,...extra});
  const COURSES = [
    {id:'ecuaciones',subject:'mat',title:'Resolver ecuaciones',level:'Secundaria',grade:'1.º',intro:'Comprende las igualdades antes de despejar letras.',minutes:35,lessons:[
      L('igualdad','¿Qué significa una igualdad?','Reconocer por qué ambos lados deben valer lo mismo.','Una ecuación es una igualdad con un valor desconocido. Podemos representarlo con una letra.',['Lee ambos lados de la igualdad por separado.','Identifica qué parte no conocemos: x.','Cambia x por un valor y comprueba si los lados coinciden.'],'Si tienes x lápices y te regalan 3, obtienes 8. Lo expresas como x + 3 = 8.',{type:'balance',left:'x + 3',right:'8'},[
        Q('¿Cuál expresión representa «un número más tres es ocho»?',['x − 3 = 8','x + 3 = 8','3x = 8','x + 8 = 3'],1,'La frase «más tres» se representa con + 3 y «es» con =.','Busca la operación que indica la palabra «más».','Revisa qué operación representa cada frase.'),
        Q('Si x = 5, ¿se cumple x + 3 = 8?',['Sí, porque 5 + 3 = 8','No, porque 5 − 3 = 2','Sí, porque 5 × 3 = 15','No, porque x tiene que ser 8'],0,'Sustituir x por 5 produce 5 + 3 = 8, y ambos lados son iguales.','Sustituye la letra por el número y calcula.'),
        Q('En 2x = 12, ¿qué significa 2x?',['Sumar 2 y x','Restar x a 2','Multiplicar 2 por x','Dividir x entre 2'],2,'El número escrito junto a una letra representa una multiplicación.','Piensa en dos grupos con la misma cantidad.')],{mistake:'No confundas 2x con 2 + x.'}),
      L('inversas','Deshacer operaciones','Resolver ecuaciones sencillas usando la operación inversa.','Hacer la misma operación en ambos lados conserva la igualdad.',['En x + 7 = 15, necesitamos quitar 7 del primer lado.','Resta 7 a ambos lados: x + 7 − 7 = 15 − 7.','Simplifica: x = 8.','Comprueba colocando 8 en la igualdad original.'],'Si tenías dinero y recibiste $7 para llegar a $15, tenías $8.',{type:'balance',left:'x + 7',right:'15'},[
        Q('¿Qué operación conviene hacer en ambos lados de x + 7 = 15?',['Sumar 7','Restar 7','Multiplicar por 7','Dividir entre 15'],1,'Restar 7 deshace la suma de 7 y deja sola la incógnita.','¿Cuál es la operación contraria de sumar?'),
        Q('¿Cuál es la solución de x − 4 = 9?',['5','9','13','36'],2,'Sumar 4 a ambos lados da x = 13; 13 − 4 = 9.','¿Qué haces para deshacer una resta?'),
        Q('Si 3x = 18, ¿cuánto vale x?',['6','15','21','54'],0,'Dividir ambos lados entre 3 da x = 6.','¿Cómo repartes 18 en tres grupos iguales?')],{mistake:'Si cambias solo un lado, la igualdad deja de estar equilibrada.'})]},
    {id:'fracciones',subject:'mat',title:'Fracciones que tienen sentido',level:'Primaria',grade:'5.º',intro:'Relaciona partes, cantidades y fracciones equivalentes.',minutes:30,lessons:[
      L('fraccion-partes','Partes de un todo','Identificar numerador y denominador en ejemplos visuales.','El denominador indica en cuántas partes iguales se divide un todo; el numerador señala cuántas se toman.',['Imagina una pizza cortada en 8 partes iguales.','El número de abajo, 8, indica las partes de la pizza.','Si tomas 3 rebanadas, escribes 3/8.','Comprueba que todas las rebanadas tengan el mismo tamaño.'],'De ocho trozos iguales de sandía, comes tres: has comido 3/8.',{type:'fraction',taken:3,total:8},[
        Q('En 3/8, ¿qué representa el 8?',['Las partes que se tomaron','El número de pizzas','Las partes iguales del todo','La mitad del todo'],2,'El denominador cuenta en cuántas partes iguales se dividió el todo.','Observa el número que se escribe debajo de la línea.'),
        Q('Si tomas 2 de 6 partes iguales, ¿qué fracción describes?',['2/6','6/2','2/8','1/6'],0,'Dos partes tomadas de seis se representan como 2/6.','Escribe arriba lo que tomas y abajo las partes totales.'),
        Q('¿Qué condición es necesaria para representar fracciones de un mismo todo?',['Que las partes sean iguales','Que todas las partes sean azules','Que el todo sea circular','Que la parte tomada sea la mayor'],0,'Las partes deben tener el mismo tamaño para ser fracciones comparables de ese todo.','Piensa qué pasaría si los trozos tuvieran tamaños distintos.')]),
      L('equivalentes','Fracciones equivalentes','Reconocer distintas fracciones que representan la misma cantidad.','Multiplicar numerador y denominador por el mismo número no cambia el valor de una fracción.',['Comienza con 1/2 de una figura.','Divide cada mitad en dos partes: ahora hay cuatro partes.','Dos de esas cuatro partes siguen siendo la mitad: 2/4.','Comprueba con una imagen o multiplicando ambos números por 2.'],'Media barra de chocolate es lo mismo que dos cuartos de barra del mismo tamaño.',{type:'fraction',taken:2,total:4},[
        Q('¿Cuál fracción tiene el mismo valor que 1/2?',['1/3','2/4','3/5','2/5'],1,'2/4 equivale a 1/2 porque las dos representan la mitad.','Piensa en duplicar arriba y abajo al mismo tiempo.'),
        Q('Completa la equivalencia: 2/3 = ?/6.',['2','3','4','6'],2,'El denominador se multiplicó por 2; el numerador también: 2 × 2 = 4.','Observa cómo cambió el número de abajo.'),
        Q('¿Qué operación conserva el valor de 3/5?',['Sumar 2 solo arriba','Multiplicar ambos números por 3','Multiplicar solo abajo por 3','Restar 1 solo arriba'],1,'Al multiplicar numerador y denominador por 3 se obtiene 9/15, equivalente a 3/5.','La misma operación debe aplicarse a los dos números.')])]},
    {id:'geometria',subject:'mat',title:'Figuras, perímetro y área',level:'Secundaria',grade:'1.º',intro:'Distingue las medidas del contorno y del espacio interior.',minutes:28,lessons:[
      L('perimetro','Medir el contorno','Calcular perímetros de figuras simples.','El perímetro es la longitud total del borde de una figura.',['Identifica los lados de la figura.','Suma las longitudes de todos los lados.','Escribe una unidad de longitud, por ejemplo centímetros.'],'Para poner una cerca alrededor de un jardín de 5 m por 3 m, necesitas 5 + 3 + 5 + 3 = 16 m.',{type:'rectangle',w:5,h:3,label:'Perímetro'},[
        Q('¿Cuál es el perímetro de un cuadrado con lados de 4 cm?',['8 cm','12 cm','16 cm','16 cm²'],2,'Cuatro lados de 4 cm suman 16 cm.','Cuenta cuántos lados iguales tiene el cuadrado.'),
        Q('Un rectángulo mide 6 m de largo y 2 m de ancho. ¿Cuál es su perímetro?',['8 m','12 m','16 m','24 m'],2,'6 + 2 + 6 + 2 = 16 metros.','No olvides sumar los cuatro lados.'),
        Q('¿Qué se está midiendo al calcular el perímetro?',['El espacio interior','La longitud del borde','El volumen','El peso de la figura'],1,'El perímetro mide la longitud que rodea la figura.','Imagina que recorres el borde con una cuerda.')]),
      L('area','Cubrir una superficie','Calcular el área de rectángulos y diferenciarla del perímetro.','El área mide cuánto espacio ocupa la superficie dentro de la figura.',['Imagina cubrir un rectángulo con cuadros de 1 unidad por lado.','Cuenta cuántos cuadros caben en una fila.','Multiplica filas por columnas.','Usa unidades cuadradas: cm², m², etc.'],'Un piso rectangular de 5 m por 3 m ocupa 5 × 3 = 15 m².',{type:'rectangle',w:5,h:3,label:'Área'},[
        Q('¿Cuál es el área de un rectángulo de 4 cm por 3 cm?',['7 cm²','12 cm²','14 cm²','24 cm²'],1,'4 × 3 = 12 centímetros cuadrados.','Cuenta filas y columnas de cuadros.'),
        Q('¿Qué unidad es adecuada para expresar un área?',['Centímetros','Litros','Centímetros cuadrados','Kilogramos'],2,'Las superficies se expresan en unidades cuadradas, como cm².','Se trata de cubrir espacios, no solo medir un borde.'),
        Q('Un rectángulo tiene área 18 m² y ancho de 3 m. ¿Cuánto mide el largo?',['6 m','15 m','21 m','54 m'],0,'18 ÷ 3 = 6 metros.','Recuerda que área = largo × ancho.')])]},
    {id:'lectura',subject:'esp',title:'Comprender lo que lees',level:'Secundaria',grade:'1.º',intro:'Identifica ideas, inferencias y evidencias en textos breves.',minutes:30,lessons:[
      L('idea-central','Identificar la idea principal','Distinguir el mensaje central de los detalles que lo explican.','La idea principal resume lo más importante del texto; los detalles la apoyan.',['Lee el párrafo completo.','Pregunta: ¿de qué trata principalmente?','Separa datos y ejemplos del mensaje central.','Resume la idea en una frase propia.'],'«Las abejas transportan polen entre flores. Esta acción ayuda a muchas plantas a producir frutos». Idea: las abejas ayudan a la reproducción de las plantas.',{type:'text',quote:'Las abejas transportan polen entre flores y ayudan a las plantas.'},[
        Q('En el texto sobre las abejas, ¿cuál es la idea principal?',['Las abejas son pequeñas','Las abejas ayudan a reproducirse a muchas plantas','Las flores tienen colores','Hay plantas en los jardines'],1,'El mensaje central describe el papel de las abejas en la reproducción de las plantas.','Busca qué explica el texto sobre las abejas.'),
        Q('¿Qué suele ser un detalle de apoyo?',['Una frase que resume todo','Un ejemplo que aclara el mensaje','El título del libro','Una conclusión que no se relaciona'],1,'Un ejemplo puede ayudar a comprender o respaldar la idea principal.','Distingue el tema de los ejemplos que lo ilustran.'),
        Q('¿Cuál estrategia ayuda a encontrar la idea central?',['Leer solo la primera palabra','Copiar todas las frases','Preguntar de qué trata principalmente','Elegir la frase más larga'],2,'Preguntar qué explica el texto en conjunto permite distinguir lo central.','Considera el sentido de todo el párrafo.')]),
      L('inferencias','Leer entre líneas','Realizar inferencias apoyadas en pistas explícitas.','Inferir es llegar a una conclusión razonable usando pistas del texto y conocimientos previos.',['Anota qué dice literalmente el texto.','Busca pistas que expliquen lo que puede estar sucediendo.','Propón una conclusión que sí esté apoyada por esas pistas.','Evita afirmar cosas que el texto no permite saber.'],'«Lucía entró empapada y cerró su paraguas». Podemos inferir que afuera estaba lloviendo, pero no cuánto tiempo.',{type:'text',quote:'Lucía entró empapada y cerró su paraguas.'},[
        Q('¿Qué se puede inferir de Lucía y el paraguas?',['Que afuera llovía','Que iba a nadar','Que salió de vacaciones','Que compró un paraguas nuevo'],0,'Estar empapada y cerrar un paraguas son pistas compatibles con lluvia.','Busca las palabras relacionadas con el agua.'),
        Q('¿Cuál afirmación NO está apoyada por ese texto?',['Lucía usaba un paraguas','Lucía estaba mojada','Lucía tardó tres horas caminando','Lucía entró a algún lugar'],2,'El texto no menciona ni permite inferir cuánto tiempo caminó.','Evita añadir datos que no aparecen.'),
        Q('¿Qué debe tener una inferencia sólida?',['Una pista del texto','Una suposición sin base','Una opinión popular','La frase más extensa'],0,'Una inferencia debe relacionarse con evidencia textual.','Busca una pista que puedas señalar.')])]},
    {id:'escritura',subject:'esp',title:'Escribir con claridad',level:'Secundaria',grade:'2.º',intro:'Organiza párrafos y utiliza conectores con propósito.',minutes:26,lessons:[
      L('parrafos','Un párrafo, una idea','Organizar la idea central, el desarrollo y el cierre.','Un párrafo claro desarrolla principalmente una idea con detalles ordenados.',['Escribe la idea que quieres comunicar.','Añade una explicación y un ejemplo pertinente.','Cierra con una frase relacionada.','Revisa que las oraciones se conecten.'],'«Leer diariamente amplía el vocabulario. Por ejemplo, conocer palabras nuevas facilita explicar ideas. Por eso conviene dedicar unos minutos a leer».',{type:'text',quote:'Idea principal → explicación → ejemplo → cierre'},[
        Q('¿Qué oración funcionaría mejor como idea principal de un párrafo sobre lectura?',['Ayer vi tres nubes','Leer con frecuencia ayuda a aprender palabras nuevas','Mi mochila es azul','Una bicicleta tiene dos ruedas'],1,'Expresa el tema que luego se puede desarrollar con detalles.','Busca la oración que resume un beneficio de leer.'),
        Q('¿Qué oración debería seguir a «Dormir bien favorece la atención»?',['Las ballenas son mamíferos','Por ejemplo, descansar ayuda a concentrarse en clase','El sol está lejos','Mi color favorito es verde'],1,'El ejemplo profundiza la relación entre descanso y atención.','Elige una idea conectada con la oración inicial.'),
        Q('¿Qué conviene revisar antes de terminar un párrafo?',['Si todas las ideas se relacionan','Si tiene exactamente diez palabras','Si no tiene verbos','Si termina siempre con una pregunta'],0,'La coherencia depende de que las oraciones apoyen un tema común.','Piensa en la relación entre las oraciones.')]),
      L('conectores','Conectar las ideas','Elegir conectores de causa, contraste y consecuencia.','Los conectores muestran la relación entre las ideas. «Porque» expresa causa; «sin embargo» contraste; «por eso» consecuencia.',['Identifica la relación entre las dos oraciones.','Selecciona un conector que exprese esa relación.','Lee la frase completa para comprobar que tenga sentido.'],'«Estudió con constancia; por eso pudo explicar el procedimiento».',{type:'text',quote:'Causa → porque | Contraste → sin embargo | Consecuencia → por eso'},[
        Q('Completa: «Había lluvia; ___, salimos con paraguas».',['sin embargo','por eso','aunque','mientras'],1,'«Por eso» expresa que usar paraguas fue una consecuencia de la lluvia.','Pregúntate si la segunda idea es resultado de la primera.'),
        Q('¿Qué conector indica contraste?',['porque','además','sin embargo','por lo tanto'],2,'«Sin embargo» presenta una oposición o diferencia respecto a la idea anterior.','Busca el que une dos ideas opuestas.'),
        Q('Completa: «No asistió ___ estaba enfermo».',['porque','sin embargo','por eso','además'],0,'«Porque» introduce la causa de la ausencia.','La frase explica el motivo de no asistir.')])]},
    {id:'ecosistemas',subject:'ciencias',title:'Ecosistemas en equilibrio',level:'Secundaria',grade:'1.º',intro:'Comprende cómo se relacionan seres vivos y su ambiente.',minutes:32,lessons:[
      L('cadenas','¿Quién se alimenta de quién?','Representar cadenas alimentarias con productores y consumidores.','La energía de una cadena alimentaria pasa de los productores a los consumidores.',['Identifica una planta que aproveche la luz solar.','Encuentra un animal que se alimente de esa planta.','Añade un animal que se alimente del anterior.','Dibuja flechas desde el alimento hacia quien lo come.'],'Pasto → saltamontes → rana: la rana obtiene energía al alimentarse del saltamontes.',{type:'flow',nodes:['Pasto','Saltamontes','Rana']},[
        Q('En «pasto → saltamontes → rana», ¿cuál es el productor?',['La rana','El saltamontes','El pasto','Ninguno'],2,'El pasto produce alimento mediante la fotosíntesis.','Busca el organismo que utiliza la energía del sol.'),
        Q('¿En qué dirección debe apuntar la flecha en una cadena alimentaria?',['Hacia quien recibe energía al alimentarse','Hacia el organismo más grande','Siempre hacia la izquierda','Solo hacia las plantas'],0,'Las flechas indican el flujo de energía desde el alimento hacia el consumidor.','Imagina quién recibe energía del alimento.'),
        Q('¿Qué puede ocurrir si disminuyen mucho las plantas de una cadena?',['No cambia nada','Los consumidores primarios pueden tener menos alimento','Aumenta necesariamente el agua','Desaparecen todas las rocas'],1,'La escasez de productores reduce alimento disponible para algunos consumidores.','Piensa qué come el primer animal.')]),
      L('factores','Lo vivo y lo no vivo','Diferenciar factores bióticos y abióticos de un ecosistema.','Los factores bióticos son los seres vivos; los abióticos son componentes como agua, aire, luz y suelo.',['Observa un entorno cercano.','Haz una lista de seres vivos.','Haz otra lista de elementos que no están vivos.','Explica cómo se relacionan ambos grupos.'],'En un manglar, los árboles y peces son bióticos; la salinidad y el agua son abióticos.',{type:'flow',nodes:['Luz y agua','Plantas','Animales']},[
        Q('¿Cuál es un factor abiótico?',['Un pez','Una planta','La luz solar','Un hongo'],2,'La luz solar no es un ser vivo y afecta las condiciones del ecosistema.','Busca algo que no esté vivo.'),
        Q('¿Cuál pareja contiene solo factores bióticos?',['Roca y agua','Árbol y hongo','Sol y arena','Aire y suelo'],1,'Árbol y hongo son organismos vivos.','Ambos integrantes deben ser seres vivos.'),
        Q('¿Por qué importa el agua en un ecosistema?',['Porque es un organismo','Porque influye en la vida de sus habitantes','Porque convierte rocas en animales','Porque sustituye toda la energía solar'],1,'El agua es un factor abiótico necesario para muchos procesos vitales.','Piensa qué necesitan los seres vivos para sobrevivir.')])]},
    {id:'celulas',subject:'ciencias',title:'La célula y la vida',level:'Media superior',grade:'1.er semestre',intro:'Explora las estructuras y funciones celulares básicas.',minutes:30,lessons:[
      L('celula','La unidad de la vida','Reconocer la célula como unidad básica de los seres vivos.','Las células forman los seres vivos y realizan funciones esenciales. Algunas formas de vida tienen una célula y otras, muchas.',['Observa una ilustración de una célula.','Identifica el límite celular.','Relaciona el interior de la célula con sus funciones.','Recuerda que hay organismos unicelulares y pluricelulares.'],'La levadura es un organismo formado por una sola célula; el cuerpo humano tiene muchas.',{type:'flow',nodes:['Célula','Tejido','Órgano']},[
        Q('¿Cuál es la unidad básica estructural de los seres vivos?',['El órgano','La célula','La molécula de agua','El tejido'],1,'La célula constituye la unidad básica de estructura y funcionamiento de la vida.','Piensa en la unidad que forma tejidos.'),
        Q('Un organismo unicelular está formado por…',['Una sola célula','Dos órganos','Varios tejidos','Un solo hueso'],0,'«Unicelular» significa constituido por una célula.','Relaciona el prefijo «uni» con su significado.'),
        Q('¿Cuál ejemplo corresponde a un ser pluricelular?',['Una bacteria común','Una levadura individual','Un árbol','Un virus'],2,'Un árbol está formado por muchas células.','Busca un ser formado por tejidos y órganos.')]),
      L('membrana','La membrana y el intercambio','Explicar la función básica de la membrana celular.','La membrana celular delimita la célula y regula el paso de sustancias.',['Identifica dónde termina la célula y empieza el exterior.','Imagina una frontera que controla el intercambio.','Relaciona el intercambio con nutrientes y desechos.'],'Así como una puerta controla lo que entra y sale de un salón, la membrana regula el paso de sustancias.',{type:'flow',nodes:['Exterior','Membrana','Interior']},[
        Q('¿Qué función tiene principalmente la membrana celular?',['Producir toda la luz','Regular el intercambio de sustancias','Reemplazar el núcleo','Crear huesos'],1,'La membrana delimita la célula y controla el intercambio con el medio.','Piensa en una frontera selectiva.'),
        Q('¿Qué puede cruzar la membrana según las condiciones?',['Solo objetos sólidos grandes','Ninguna sustancia','Diversas sustancias de manera regulada','Únicamente luz'],2,'La membrana permite el paso regulado de distintas sustancias.','La membrana no es una pared totalmente cerrada.'),
        Q('¿Por qué ayuda la membrana a mantener el equilibrio celular?',['Permite regular entradas y salidas','Hace a todas las células idénticas','Evita toda reacción interna','Elimina la necesidad de nutrientes'],0,'Regular entradas y salidas ayuda a conservar condiciones internas compatibles con la vida.','Relaciona el intercambio con las necesidades de la célula.')])]},
    {id:'historia',subject:'hist',title:'Investigar el pasado',level:'Secundaria',grade:'1.º',intro:'Aprende a usar fuentes y construir explicaciones históricas.',minutes:29,lessons:[
      L('fuentes','¿Cómo sabemos qué pasó?','Reconocer fuentes históricas primarias y secundarias.','Una fuente primaria proviene del periodo estudiado; una secundaria analiza o interpreta evidencias después.',['Identifica quién creó el documento u objeto.','Pregunta cuándo fue elaborado.','Relaciona su origen con el hecho que investigas.','Compara fuentes para evitar depender de una sola versión.'],'Una carta escrita durante un acontecimiento puede ser fuente primaria; un libro actual que analiza las cartas, secundaria.',{type:'flow',nodes:['Carta de época','Investigación','Explicación']},[
        Q('¿Cuál suele ser una fuente primaria sobre un suceso de 1910?',['Un diario escrito en 1910','Un libro escolar actual','Una reseña escrita hoy','Una película contemporánea de ficción'],0,'Un diario de la época puede aportar evidencia directa del periodo estudiado.','Busca un testimonio creado durante los hechos.'),
        Q('¿Qué caracteriza a una fuente secundaria?',['Siempre es falsa','Analiza evidencias sobre un periodo','Solo puede ser un objeto','No tiene autor'],1,'Las fuentes secundarias interpretan o sintetizan información de otras evidencias.','Piensa en un texto escrito después para explicar lo ocurrido.'),
        Q('¿Por qué conviene comparar varias fuentes?',['Para encontrar distintas perspectivas','Para eliminar todas las fechas','Para evitar leer','Para cambiar los hechos'],0,'Contrastar fuentes ayuda a reconocer coincidencias, contradicciones y perspectivas.','Una sola voz puede mostrar solo parte de la historia.')]),
      L('cronologia','Ordenar acontecimientos','Leer y construir una línea del tiempo.','Una línea del tiempo organiza hechos en secuencia cronológica para observar cambios y continuidades.',['Anota la fecha de cada acontecimiento.','Ordena los hechos del más antiguo al más reciente.','Calcula el tiempo transcurrido entre ellos.','Explica qué cambió o permaneció.'],'Si un hecho ocurrió en 1821 y otro en 1910, el primero es anterior y entre ambos hay 89 años.',{type:'flow',nodes:['1821','1910','2020']},[
        Q('¿Cuál año ocurrió primero?',['1910','1821','2020','2010'],1,'1821 es anterior a los otros tres años.','En años de nuestra era, el número menor ocurre antes.'),
        Q('¿Cuántos años hay de 1900 a 1950?',['25','50','100','150'],1,'1950 − 1900 = 50 años.','Resta el año inicial al final.'),
        Q('¿Qué permite observar una línea del tiempo?',['El orden temporal de hechos','La temperatura de una ciudad','El peso de un objeto','La distancia entre planetas'],0,'La línea del tiempo sitúa acontecimientos para analizar su orden y relaciones.','Piensa qué representan las fechas.')])]},
    {id:'english',subject:'ingles',title:'Inglés para hablar de ti',level:'Secundaria',grade:'1.º',intro:'Describe hábitos usando presente simple y expresiones de tiempo.',minutes:31,lessons:[
      L('present','Present simple: hábitos','Usar correctamente el presente simple para rutinas.','En presente simple, «I/you/we/they» suelen usar el verbo base; «he/she/it» suele añadir -s.',['Identifica quién realiza la acción.','Elige el verbo que corresponda al sujeto.','Añade una expresión de frecuencia cuando sea útil.','Lee la oración y verifica la concordancia.'],'I play soccer on Fridays. She plays soccer on Fridays.',{type:'text',quote:'I play · She plays · We play'},[
        Q('Completa: «She ___ English every day».',['study','studies','studying','studied'],1,'Con «she», el verbo «study» cambia a «studies» en presente simple.','Observa el sujeto «she».'),
        Q('Elige la oración correcta para un hábito.',['They walks to school','They walk to school','They walking to school','They walked yesterday'],1,'«They» usa la forma base «walk» para expresar un hábito en presente simple.','«They» no lleva -s en el verbo de esta oración.'),
        Q('¿Qué expresión indica frecuencia?',['never','yesterday','next week','last year'],0,'«Never» expresa que algo no ocurre en una rutina.','Piensa en palabras que expresan qué tan seguido sucede algo.')]),
      L('questions','Preguntar por las rutinas','Formar preguntas simples usando do y does.','Para preguntas del presente simple se usa «do» con I/you/we/they y «does» con he/she/it; después va el verbo base.',['Identifica el sujeto.','Elige do o does.','Coloca el sujeto y el verbo base después.','Agrega el complemento y el signo de pregunta.'],'Do you read at night? Does she read at night?',{type:'text',quote:'Do you play? · Does he play?'},[
        Q('Completa: «___ he play soccer?»',['Do','Does','Is','Are'],1,'«Does» se utiliza para preguntas con «he» en presente simple.','Fíjate en que el sujeto es «he».'),
        Q('¿Cuál pregunta es correcta?',['Does she studies?','Do she study?','Does she study?','She does study?'],2,'Después de «does», el verbo principal queda en forma base: study.','«Does» ya marca la tercera persona; el verbo no necesita -s.'),
        Q('Completa: «___ they live here?»',['Does','Do','Is','Has'],1,'«Do» corresponde al sujeto plural «they» en presente simple.','Busca el auxiliar para «they».')])]},
    {id:'ciudadania',subject:'civica',title:'Cuidarnos en internet',level:'Secundaria',grade:'1.º',intro:'Protege tus datos y aprende a verificar mensajes.',minutes:27,lessons:[
      L('privacidad','Tus datos importan','Reconocer información personal que conviene proteger.','La información personal debe compartirse solo cuando sea necesaria y con personas o servicios confiables.',['Identifica qué datos te describen o localizan.','Revisa quién solicita la información y para qué.','Configura la privacidad antes de publicar.','Pide apoyo a una persona de confianza si algo te genera duda.'],'Antes de publicar una foto de tu credencial, piensa quién podría acceder a tus datos.',{type:'flow',nodes:['Piensa','Revisa','Comparte con cuidado']},[
        Q('¿Qué dato requiere especial cuidado al publicarse?',['Tu dirección completa','Tu película favorita','Tu color favorito','El nombre de un planeta'],0,'Tu dirección permite localizarte y no debe divulgarse públicamente sin necesidad.','Piensa qué información podría usarse para encontrarte.'),
        Q('Una app pide tu contraseña por un mensaje. ¿Qué conviene hacer?',['Enviarla enseguida','No compartirla y verificar el origen','Publicarla en un foro','Usar la misma contraseña en todo'],1,'Las contraseñas son privadas; conviene verificar solicitudes por canales oficiales.','Una contraseña permite entrar a tu cuenta.'),
        Q('Antes de subir una foto de un amigo, conviene…',['Pedirle permiso','Compartirla sin preguntar','Añadir su dirección','Enviar su teléfono'],0,'Pedir consentimiento respeta la privacidad de otras personas.','Piensa en quién aparece en la foto y si quiere compartirla.')]),
      L('verificar','¿Es confiable esta información?','Examinar la fuente y contrastar afirmaciones.','Una afirmación puede parecer creíble sin estar comprobada. Conviene revisar autor, fecha, evidencia y otras fuentes.',['Lee la afirmación completa.','Busca quién la publicó y cuándo.','Comprueba si presenta evidencia verificable.','Contrasta con otras fuentes confiables.'],'Si un mensaje promete que mañana no habrá clases, verifica primero el aviso de tu escuela.',{type:'flow',nodes:['Quién lo dice','Qué pruebas hay','Confirmar']},[
        Q('¿Qué paso ayuda a verificar una noticia?',['Compartirla primero','Revisar su fuente y fecha','Confiar solo en el título','Ignorar cualquier evidencia'],1,'La fuente y la fecha son pistas fundamentales para valorar la información.','Piensa quién publicó el mensaje y cuándo.'),
        Q('Si dos fuentes confiables ofrecen datos distintos, conviene…',['Revisar sus evidencias y contexto','Elegir la más llamativa','Ocultar la diferencia','Asumir que ambas mienten'],0,'Comparar evidencias, fechas y contexto ayuda a entender las diferencias.','Busca qué datos sustentan cada versión.'),
        Q('¿Qué señal puede justificar revisar una afirmación con cuidado?',['Incluye un título muy alarmante sin pruebas','Tiene autor y fuentes consultables','Muestra una fecha clara','Presenta información contrastable'],0,'Un tono alarmista sin evidencia es una razón para verificar antes de compartir.','Una emoción intensa no reemplaza la evidencia.')])]},
    {id:'programacion',subject:'tec',title:'Pensar como programador',level:'Media superior',grade:'1.er semestre',intro:'Descubre algoritmos, condiciones y cómo depurar pasos.',minutes:34,lessons:[
      L('algoritmos','Instrucciones en orden','Diseñar secuencias claras para resolver tareas.','Un algoritmo es una secuencia finita de instrucciones bien definidas para lograr un objetivo.',['Describe la tarea que quieres resolver.','Separa la tarea en pasos pequeños.','Ordena los pasos según las dependencias.','Prueba la secuencia y corrige los pasos ambiguos.'],'Para preparar un sándwich: reunir ingredientes → colocar pan → añadir relleno → cerrar.',{type:'flow',nodes:['Inicio','Pasos claros','Resultado']},[
        Q('¿Cuál secuencia es lógica para preparar té?',['Beber → hervir → servir','Hervir agua → preparar → servir','Servir → hervir → beber','Guardar taza → hervir → beber'],1,'Primero se prepara el agua y luego la bebida antes de servirla.','Piensa qué acción debe suceder antes.'),
        Q('¿Qué característica debe tener una instrucción de un algoritmo?',['Ser ambigua','Ser clara y ejecutable','Depender siempre de suerte','No tener propósito'],1,'Las instrucciones claras permiten seguir el procedimiento de forma consistente.','Imagina que otra persona debe seguir tus pasos.'),
        Q('¿Qué se hace al encontrar un paso equivocado?',['Revisarlo y corregirlo','Ocultarlo siempre','Ignorar el resultado','Borrar todo sin analizar'],0,'Revisar el error permite mejorar el algoritmo y su resultado.','Probar y corregir es parte de construir soluciones.')]),
      L('condiciones','Decidir con condiciones','Interpretar decisiones del tipo «si… entonces…».','Una condición se evalúa como verdadera o falsa y permite elegir qué acción ejecutar.',['Escribe una pregunta con respuesta sí/no.','Determina qué hacer si se cumple.','Añade la alternativa si no se cumple.','Prueba ambos casos.'],'Si llueve, usa paraguas; si no, continúa normalmente.',{type:'flow',nodes:['¿Llueve?','Sí: paraguas','No: continuar']},[
        Q('En «si temperatura > 30, encender ventilador», ¿cuándo se enciende?',['A 20 grados','A 30 grados exactos','A 31 grados','A 10 grados'],2,'31 es mayor que 30, por lo que la condición se cumple.','El símbolo > significa «mayor que».'),
        Q('¿Qué sucede si la condición de un «si» es falsa?',['Se ejecuta necesariamente la rama verdadera','Puede ejecutarse la alternativa «si no»','El algoritmo siempre termina','Se repite el paso anterior'],1,'La rama «si no» permite ejecutar acciones cuando la condición no se cumple.','Piensa en una decisión con dos caminos.'),
        Q('¿Cuál condición comprueba si una edad es al menos 18?',['edad > 18','edad < 18','edad >= 18','edad = 0'],2,'«>= 18» incluye 18 y todos los valores mayores.','«Al menos» también incluye el número indicado.')])]} 
    ,{id:'investigacion',subject:'invest',title:'Investigar con evidencia',level:'Superior',grade:'1.er año',intro:'Formula preguntas investigables y reconoce qué permiten concluir los datos.',minutes:38,lessons:[
      L('preguntas-investigacion','Preguntar para investigar','Formular preguntas claras, acotadas y observables.','Una pregunta investigable debe poder abordarse mediante datos, observaciones o un método explícito.',['Elige un tema que te interese.','Delimita población, situación o periodo.','Identifica qué información necesitarías reunir.','Reformula la pregunta hasta que se pueda responder con evidencia.'],'En lugar de preguntar «¿Es mala la tecnología?», pregunta «¿Cuánto tiempo dedican a leer en pantalla los estudiantes de un grupo durante una semana?».',{type:'flow',nodes:['Tema','Pregunta concreta','Datos']},[
        Q('¿Cuál pregunta es más fácil de investigar con observaciones?',['¿Cuál es el mejor pasatiempo del mundo?','¿Cuántos libros se prestaron este mes en la biblioteca?','¿Qué color es el más bonito?','¿Quién tiene la opinión más correcta?'],1,'El número de préstamos en un periodo se puede consultar y medir.','Piensa qué pregunta requiere datos observables.'),
        Q('¿Qué mejora una pregunta de investigación demasiado amplia?',['Delimitar a quién, dónde o cuándo observar','Quitar toda referencia a los datos','Elegir una respuesta antes de estudiar','Usar siempre más palabras'],0,'Delimitar el alcance ayuda a definir qué evidencia puede responderla.','Piensa en la población y el periodo.'),
        Q('¿Qué debe definirse antes de recoger datos?',['Solo el título final','Qué se observará y cómo','El resultado que deseas obtener','El color de la portada'],1,'Definir qué medir u observar reduce ambigüedad en la investigación.','Una medición necesita un procedimiento.')]),
      L('evidencia-causalidad','¿Relación o causa?','Diferenciar correlaciones de afirmaciones causales.','Que dos variables cambien juntas no prueba, por sí solo, que una provoque la otra.',['Identifica las dos variables que se comparan.','Reconoce si existe una asociación en los datos.','Considera otras explicaciones posibles.','Evita concluir causalidad sin evidencia suficiente.'],'En días calurosos pueden aumentar las ventas de helado y los baños en alberca. No significa que comer helado provoque ir a nadar.',{type:'flow',nodes:['Aumenta calor','Más helados','Más alberca']},[
        Q('Dos variables aumentan juntas. ¿Qué conclusión es válida por sí sola?',['Una causa necesariamente la otra','Existe una asociación observada','No pueden tener relación','Son variables idénticas'],1,'Un cambio conjunto muestra asociación, no necesariamente causa y efecto.','Distingue observar una relación de explicar su origen.'),
        Q('En el ejemplo del helado y la alberca, ¿qué variable podría influir en ambas?',['La temperatura del día','La marca del cuaderno','El color del plato','El nombre de la calle'],0,'El calor puede relacionarse con más consumo de helado y más actividades en alberca.','Busca un factor común a ambos comportamientos.'),
        Q('¿Qué conviene hacer antes de afirmar que algo causa otro fenómeno?',['Evaluar otras explicaciones y reunir evidencia adicional','Elegir el gráfico más bonito','Suponer que toda correlación basta','Eliminar datos que no coinciden'],0,'Para inferir causalidad hay que valorar explicaciones alternativas y el diseño del estudio.','Una asociación puede tener otras causas.')])]}

  /* Modos de aprendizaje guiados, precargados para las 24 lecciones.

  const APPROACHES = {
    'igualdad':['Piensa en una balanza: aunque cambie lo que hay a la izquierda, ambos lados deben pesar lo mismo. La letra guarda el lugar de lo que todavía desconoces.','Dos cajas juntas deben pesar lo mismo: una tiene una caja misteriosa y tres libros; la otra pesa como ocho libros.','Si x vale cinco, la igualdad se cumple al reemplazar la caja misteriosa.'],
    'inversas':['Deshacer una operación es recorrer el camino al revés. Si agregaste siete, para regresar al punto de partida quitas siete.','Un viaje de ida y vuelta: subes siete escalones y bajas siete para volver al nivel inicial.','Mira qué se le hizo a x y prueba la operación opuesta en ambos lados.'],
    'fraccion-partes':['Una fracción cuenta cuántas partes iguales hay y cuántas eliges. Primero revisa que todas las piezas sean del mismo tamaño.','Una hoja dividida en ocho recuadros iguales: coloreas tres y dejas cinco sin marcar.','El número de abajo cuenta las piezas totales; el de arriba cuenta las seleccionadas.'],
    'equivalentes':['Puedes cortar una misma porción en piezas más pequeñas sin cambiar la cantidad total que tienes.','Media manzana puede representarse como dos cuartos si los cuartos tienen el mismo tamaño.','Revisa si ambas fracciones ocupan la misma proporción de un mismo todo.'],
    'perimetro':['El perímetro es una vuelta alrededor de la figura. No necesitamos saber cuánto espacio hay dentro: solo cuánto mide su borde.','Imagina comprar cinta para decorar los cuatro lados de una cartulina.','Sigue todo el borde con el dedo y suma cada longitud una sola vez.'],
    'area':['El área cuenta cuántos cuadros iguales caben dentro de una superficie. Las filas y columnas ayudan a contar más rápido.','Un tapete de cinco filas con tres mosaicos por fila cubre quince mosaicos.','Piensa en cubrir el piso completo sin dejar huecos ni encimar piezas.'],
    'idea-central':['La idea principal es el mensaje que permanece si quitas los ejemplos y detalles.','En una noticia sobre limpieza de playas, las fechas pueden ser detalles, pero el cuidado de la playa es la idea central.','Pregunta qué están intentando explicar todas las oraciones juntas.'],
    'inferencias':['Inferir es unir pistas del texto para descubrir algo probable, sin inventar datos.','Si alguien llega con botas mojadas y un impermeable, las pistas hacen razonable pensar que afuera llovía.','Distingue lo que está escrito de lo que deduces y justifica tu conclusión con una pista.'],
    'parrafos':['Cada párrafo es como una pequeña conversación sobre una sola idea. Todo lo que escribes debe ayudar a explicarla.','Describe por qué cuidar una planta ayuda al ambiente y añade un ejemplo que apoye esa misma idea.','Lee cada oración y pregunta si ayuda a explicar la oración principal.'],
    'conectores':['Los conectores son puentes: muestran si una oración explica una causa, presenta una diferencia o muestra una consecuencia.','Se fue la luz; por eso encendimos una linterna.','Primero identifica la relación entre ideas y luego elige la palabra que la expresa.'],
    'cadenas':['Una cadena alimentaria muestra cómo pasa la energía de un ser vivo a otro cuando uno se alimenta del anterior.','Pasto que alimenta a un conejo y conejo que alimenta a un zorro.','La flecha va desde el alimento hasta quien obtiene energía al comerlo.'],
    'factores':['Un ecosistema combina seres vivos con elementos del ambiente, como aire, suelo, luz y agua. Ambos se relacionan.','Una planta necesita luz, agua y suelo; un insecto puede utilizarla como alimento.','Separa primero lo que tiene vida de lo que no tiene vida y después identifica sus relaciones.'],
    'celula':['La célula es una unidad muy pequeña que forma parte de los seres vivos y realiza funciones necesarias para vivir.','Un edificio tiene habitaciones con funciones distintas; los organismos contienen células con distintas funciones.','Observa cómo las partes se relacionan para mantener con vida a la célula.'],
    'membrana':['La membrana es una frontera selectiva: ayuda a controlar qué entra y sale de la célula.','Como una puerta con control de acceso, deja pasar algunas sustancias y restringe otras.','Compara lo que está fuera y dentro; piensa por qué conviene regular el intercambio.'],
    'fuentes':['Una fuente histórica es una pista del pasado. Para entenderla, pregunta quién la creó, cuándo y para qué.','Una carta antigua puede contar cómo vivía una familia, pero no explica por sí sola toda una época.','Distingue lo que la fuente muestra directamente de tu interpretación.'],
    'cronologia':['Una cronología coloca los hechos en orden temporal. El primero va antes y el último después.','Ordena el inicio de una obra, su construcción y su inauguración.','Busca las fechas y colócalas de la más antigua a la más reciente.'],
    'present':['El presente simple en inglés sirve para hablar de rutinas y hechos habituales, no de una acción que ocurre una sola vez.','I play soccer on Saturdays expresa una actividad que repites cada sábado.','Busca palabras que indiquen frecuencia como every day u often.'],
    'questions':['Para preguntar por hábitos en inglés, a menudo usamos do o does antes del sujeto y la forma base del verbo.','Do you read at night? pregunta por una costumbre, no por una sola noche específica.','Observa quién hace la acción y el auxiliar usado para construir la pregunta.'],
    'privacidad':['Tu información personal debe compartirse solo cuando es necesario y con personas o servicios de confianza.','Antes de publicar una foto, revisa si revela datos como tu escuela o ubicación.','Pregúntate quién podría ver ese dato y qué podría hacer con él.'],
    'verificar':['No todo lo que aparece en internet es confiable. Contrasta autor, fecha, evidencia y otras fuentes.','Antes de compartir una noticia sorprendente, revisa si una institución confiable la confirma.','Busca de dónde salió la información y si hay pruebas que la respalden.'],
    'algoritmos':['Un algoritmo es una lista ordenada de instrucciones claras para conseguir un resultado.','Una receta funciona si sigues los pasos en el orden correcto.','Prueba seguir las instrucciones literalmente: ¿alguien podría completar la tarea sin adivinar?'],
    'condiciones':['Una condición permite escoger qué hacer según una situación: si sucede algo, hacemos una acción; si no, otra.','Si llueve, lleva paraguas; si no, puedes salir sin él.','Identifica la pregunta que decide entre dos caminos.'],
    'preguntas-investigacion':['Una buena pregunta de investigación es clara, concreta y permite reunir información para responderla.','¿Cómo cambia el crecimiento de una planta con distinta cantidad de luz?','Precisa qué quieres observar y evita mezclar demasiadas preguntas en una sola.'],
    'evidencia-causalidad':['Que dos cosas ocurran juntas no significa que una cause la otra. Necesitamos más evidencia.','Cuando aumentan las ventas de helado también puede aumentar el calor; el helado no necesariamente provoca calor.','Busca otras variables que puedan explicar lo que observas.']

  const modeHeader=l=>html`<div class="cat-mode-head"><div><span class="cat-kicker">Elige la forma que te ayude</span><h2 id="cat-modes-title">¿Cómo quieres aprender este tema?</h2><p>Puedes cambiar de forma cuantas veces quieras. La idea es comprenderlo, no memorizar una respuesta.</p></div><span class="cat-grade">5 formas de aprender · sin Wi-Fi</span></div>`;
  function interactiveGraphic(l,step){
    const v=l.visual, progress=step+1, total=l.steps.length;
    if(v.type==='fraction'){
      const reveal=Math.min(v.taken,Math.max(0,Math.round(progress/total*v.taken)));
      return html`<figure class="cat-graphic" aria-label="Representación de fracción ${v.taken} de ${v.total}. Etapa ${progress} de ${total}">
        <div class="cat-fraction-grid" style="--n:${v.total}">${Array.from({length:v.total},(_,i)=>html`<span class="${i<reveal?'filled':'is-next'}" aria-label="Parte ${i+1}: ${i<reveal?'marcada':'sin marcar'}">${i<reveal?'●':'○'}</span>`)}</div>
        <figcaption>${reveal} partes marcadas de ${v.total}. La representación final muestra ${v.taken}/${v.total}. Todas las partes deben tener igual tamaño.</figcaption>
      </figure>`;
    }
    if(v.type==='flow'){
      const active=Math.min(v.nodes.length-1,Math.floor(step/Math.max(1,total-1)*(v.nodes.length-1)));
      return html`<figure class="cat-graphic" role="group" aria-label="Diagrama de ${v.nodes.length} conceptos relacionados">
      <ol class="cat-flow">${v.nodes.map((n,i)=>html`<li class="${i===active?'is-current':i>active?'is-future':''}"><span>${i+1}. ${n}</span>${i<v.nodes.length-1?html`<b aria-hidden="true">→</b>`:''}</li>`)}</ol>
      <figcaption>Ahora observa «${v.nodes[active]}». El número y el borde indican el concepto actual; las flechas muestran la relación.</figcaption></figure>`;
    }
    if(v.type==='rectangle'){
      const area=v.label==='Área';
      return html`<figure class="cat-graphic" role="group" aria-label="Rectángulo de ${v.w} por ${v.h} unidades, para entender ${v.label}">
      <div class="cat-rect-wrap"><div class="cat-rect" data-goal="${v.label}"><span>${v.w} × ${v.h}</span></div>
      <span>${area?'Cuenta los cuadros del interior':'Recorre los cuatro lados'} · ${v.w} por ${v.h} unidades</span></div>
      <figcaption>${area?`Interior: ${v.w} filas o columnas por ${v.h} = ${v.w*v.h} unidades cuadradas.`:`Borde: ${v.w} + ${v.h} + ${v.w} + ${v.h} = ${2*(v.w+v.h)} unidades.`} ${progress} de ${total} pasos.</figcaption></figure>`;
    }
    if(v.type==='balance'){
      return html`<figure class="cat-graphic cat-balance" role="group" aria-label="Igualdad entre ${v.left} y ${v.right}">
        <div class="cat-balance-beam"><span>${v.left}</span><div class="cat-balance-pivot">=</div><span>${v.right}</span></div>

      </figure>`;
    }
    return html`<figure class="cat-graphic" role="group" aria-label="Organizador visual del texto de ${l.title}">
        <ol class="cat-flow"><li class="is-current"><span>1. Lee</span><b aria-hidden="true">→</b></li><li><span>2. Busca pistas</span><b aria-hidden="true">→</b></li><li><span>3. Explica</span></li></ol>
        <blockquote class="cat-quote">${v.quote}</blockquote>

      </figure>`;
  }

      <button type="button" class="btn btn--secondary" data-action="cat-mode" data-mode="steps" data-id="${l.id}">${icon('route',17)}Explícamelo paso a paso</button></div>`;
    if(mode==='steps')return html`<div class="cat-mode-content" id="cat-mode-content" aria-label="Explicación paso a paso"><h3>Vamos por partes</h3>
      <p>Lee cada instrucción. Puedes volver a los dibujos para ver la misma idea representada.</p>

  function fullPlan(t){

  const guide=TA.navHelp={

    'guia-pick':el=>{selection=el.dataset.id;query='';updateAndFocus();},
    'guia-walk':el=>{walking=el.dataset.id;selection=walking;focusNext=true;offRoute=false;expectedNext=null;TA.dialog.close();TA.render();},

  <script>
/* =========================================================
   EstudiandoAndo · aplicación
   Estado, persistencia, conexión, enrutador por hash,
   estructura de la página, ajustes de accesibilidad y
   delegación de eventos.
   ========================================================= */
(function (TA) {
  'use strict';

  const { html, icon, mascot, attr, data, ui } = TA;
  const STORE_KEY = 'state-v2';

  /* =========================================================
     Estado
     ========================================================= */
  const clone = (obj) => JSON.parse(JSON.stringify(obj));

  const DEFAULT_PREFS = {
    theme: 'system', // system | light | dark | contrast
    look: 'aurora', // aurora | graphite | sunrise
    font: 'modern', // modern | friendly | classic
    text: 'md', // md | lg | xl | xxl
    spacing: false, // espaciado de texto amplio (WCAG 1.4.12)
    motion: 'system', // system | reduce
    simple: true, // vista sencilla activada por defecto
    voice: false, // botones de lectura en voz alta
    saver: true,
    wifiOnly: true,
    device: 'auto' // auto | mobile | desktop: vista de la demostración
  };

  function studentProgress(id) {
    const st = data.students[id];
    return {
      mastery: st.mastery.slice(),
      diagnostic: { answers: null, at: null },
      check: null,
      hints: 1,
      solutionShown: false,
      guideStep: 1,
      chat: st.chat.map((m) => ({ id: TA.util.uid(), status: 'sent', ...m })),
      format: 'steps',
      packages: Object.fromEntries(data.packages.map((p) => [p.id, p.status])),
      plan: { level: 'Secundaria', grade: '1.º', school: 'Secundaria de ejemplo · Xalapa, Ver.' },
      pendingSync: 0
    };
  }

  function defaultState() {
    return {
      role: 'student',
      studentId: 'x',
      simulateOffline: false,
      integrity: { demoClass: false, events: [] },
      dataMode: 'auto', // auto | local
      catalog: {results:{x:{},d:{}},bookmarks:{x:[],d:[]},assignments:{}},
      prefs: clone(DEFAULT_PREFS),
      progress: { x: studentProgress('x'), d: studentProgress('d') },
      teacher: {
        alerts: Object.fromEntries(data.alerts.map((a) => [a.id, { status: 'new', suggestion: null }])),
        outbox: clone(data.teacherMessages),
        privacy: { own: true, labels: true, review: true },
        plan: { ps1: true, ps2: true, ps3: false },
        onlyAttention: false,
        alertFilter: 'new',
        selected: 'x',
        activeGroup: '1b',
        aiLoading: false
      }
    };
  }

  /** Estado persistente + estado efímero de interfaz (no se guarda). */
  function loadState() {
    const base = defaultState();
    const saved = TA.store.get(STORE_KEY, null);
    if (saved && typeof saved === 'object') {
      Object.assign(base, saved);
      base.prefs = { ...DEFAULT_PREFS, ...(saved.prefs || {}) };
      base.teacher = { ...defaultState().teacher, ...(saved.teacher || {}), aiLoading: false };
      base.catalog = { ...defaultState().catalog, ...(saved.catalog || {}) };
      base.integrity = { ...defaultState().integrity, ...(saved.integrity || {}) };
      if (!Array.isArray(base.integrity.events)) base.integrity.events = [];
    }
    base.realOnline = navigator.onLine !== false;
    base.ui = { visualStep: 0, balanceStep: 0, typing: false, demoOpen: false, firstRender: true };
    base.drafts = { diagnostic: {}, check: {}, chatError: '' };
    return base;
  }

  TA.state = loadState();

  TA.save = () => {
    const { role, studentId, simulateOffline, dataMode, prefs, progress, teacher, catalog, integrity } = TA.state;
    TA.store.set(STORE_KEY, { role, studentId, simulateOffline, dataMode, prefs, progress, teacher, catalog, integrity });
    // Mantener la vista previa sincronizada incluso cuando file:// bloquea localStorage.
    if (window.self !== window.top) {
      window.parent.postMessage({ type: 'estudiando-ando:state', state: { role, studentId, simulateOffline, dataMode, prefs, progress, teacher, catalog, integrity } }, '*');
    }
  };

  TA.prefersReducedMotion = () => TA.state.prefs.motion === 'reduce'
    || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /** Copia en memoria lo que otra ventana o el marco de vista previa guardó. */
  function syncFromStorage() {
    const fresh = loadState();
    ['role', 'studentId', 'simulateOffline', 'dataMode', 'prefs', 'progress', 'teacher', 'catalog', 'integrity'].forEach((k) => { TA.state[k] = fresh[k]; });
  }

  /* =========================================================
     Vista: automática, móvil o escritorio
     - Automática: se adapta a la pantalla real (por defecto).
     - Móvil en pantalla ancha: la app se muestra dentro de un
       marco de teléfono (iframe de 390 px), así se comporta
       exactamente como en un celular.
     - Escritorio en pantalla angosta: en teléfonos y tabletas
       se amplía el viewport (como «ver versión de escritorio»);
       en una ventana angosta de computadora se muestra reducida.
     ========================================================= */
  const EMBEDDED = (() => { try { return window.self !== window.top; } catch (_) { return true; } })();
  const DESKTOP_WIDTH = 1280;
  const mq = {
    phoneFits: window.matchMedia('(min-width: 30em)'),
    desktop: window.matchMedia('(min-width: 60em)'),
    coarse: window.matchMedia('(pointer: coarse)')
  };
  const VIEW_TEXT = {
    auto: 'Vista automática: se adapta al tamaño de tu pantalla.',
    mobile: 'Vista móvil activada.',
    desktop: 'Vista web activada.'
  };
  const msgOrigin = () => (window.location.protocol === 'file:' || window.location.origin === 'null' ? '*' : window.location.origin);

  /** App adaptable, teléfono enmarcado o web enmarcada en la misma página. */
  function viewMode() {
    if (EMBEDDED || TA.state.prefs.device === 'auto') return 'app';
    if (TA.state.prefs.device === 'mobile') return mq.phoneFits.matches ? 'phone' : 'app';
    return 'desktop';
  }

  // Nunca alterar meta viewport: mantiene zoom y accesibilidad en un teléfono real.
  function applyViewport() {
    const meta = document.querySelector('meta[name="viewport"]');
    if (meta && meta.content !== 'width=device-width, initial-scale=1, viewport-fit=cover')
      meta.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
  }

  // En HTML independiente se genera una vista previa autónoma usando srcdoc.
  // Así el marco puede abrirse sin HTTP y sin solicitar una segunda página.
  const STANDALONE = document.documentElement.hasAttribute('data-standalone');
  let standaloneDocument = '';

  const viewControl = () => (EMBEDDED ? '' : ui.segmented({
    name: 'device',
    legend: 'Vista',
    action: 'device',
    value: TA.state.prefs.device,
    options: [
      { value: 'auto', label: 'Automática', icon: 'compass' },
      { value: 'mobile', label: 'Móvil', icon: 'phone' },
      { value: 'desktop', label: 'Web', icon: 'monitor' }
    ]

  /* =========================================================
     Conexión y sincronización
     ========================================================= */
  TA.net = {
    /** online · offline (sin conexión real o simulada) · local (elegido por la persona) */
    status() {
      const s = TA.state;
      if (!s.realOnline || s.simulateOffline) return 'offline';
      if (s.dataMode === 'local') return 'local';
      return 'online';
    },
    isOnline: () => TA.net.status() === 'online'
  };

  TA.sync = {
    pendingItems() {
      const items = [];
      if (TA.state.role === 'teacher') {
        const n = TA.state.teacher.outbox.filter((m) => m.status === 'queued').length;
        if (n) items.push({ n, icon: 'send', label: `${TA.util.plural(n, 'mensaje', 'mensajes')} para tus estudiantes` });
        return items;
      }
      const p = TA.student.progress();
      const q = p.chat.filter((m) => m.status === 'queued').length;
      if (q) items.push({ n: q, icon: 'chat', label: `${TA.util.plural(q, 'pregunta', 'preguntas')} para EstudiandoAndo` });
      if (p.pendingSync) items.push({ n: p.pendingSync, icon: 'check', label: `${TA.util.plural(p.pendingSync, 'resultado guardado', 'resultados guardados')} en tu equipo` });
      return items;
    },
    pendingCount: () => TA.sync.pendingItems().reduce((total, it) => total + it.n, 0),
    /** Envía lo pendiente. `auto` indica que se disparó al recuperar la conexión. */
    run({ auto = false } = {}) {
      if (!TA.net.isOnline()) return;
      const answered = TA.student.flushQueue();
      const sent = TA.teacher.flushOutbox();
      TA.save();
      TA.render();
      const parts = [];
      if (answered) parts.push(`EstudiandoAndo respondió ${TA.util.plural(answered, 'pregunta guardada', 'preguntas guardadas')}`);
      if (sent) parts.push(`se ${sent === 1 ? 'envió' : 'enviaron'} ${TA.util.plural(sent, 'mensaje', 'mensajes')}`);
      if (parts.length) TA.toast(`Sincronizado: ${parts.join(' y ')}.`, { tone: 'ok' });
      else if (!auto) TA.toast('Sin elementos pendientes en esta demostración.', { tone: 'ok' });
    }
  };

  /** Aplica un cambio que afecta la conexión y sincroniza si se recuperó. */
  function changeNetwork(mutator) {
    const was = TA.net.isOnline();
    mutator();
    const now = TA.net.isOnline();
    TA.save();
    TA.render();
    if (TA.dialog.isOpen() && document.getElementById('conn-panel')) TA.dialog.update(connectionPanel());
    if (!was && now) {
      TA.toast('Conexión recuperada. Actualizando la demostración local…', { tone: 'ok', duration: 3000 });
      setTimeout(() => TA.sync.run({ auto: true }), 400);
    } else if (was && !now) {
      TA.toast(TA.net.status() === 'local' ? 'Modo local activado: no se usarán datos.' : 'Sin internet. Sigues trabajando con lo descargado.', { tone: 'warn' });
    }
  }

  /* =========================================================
     Enrutador (hash): permite usar «Atrás» del navegador,
     guardar enlaces y compartir pantallas (Nielsen 3).
     ========================================================= */
  const ROUTES = {
    '/inicio': { role: 'student', nav: 'inicio', title: 'Inicio', view: () => TA.student.views.home() },
    '/aprender': { role: 'student', nav: 'aprender', title: 'Aprender', view: () => TA.student.views.learn() },
    '/catalogo': { role: 'student', nav: 'aprender', title: 'Biblioteca de materias', view: () => TA.catalog.views.catalog() },
    '/curso': { role: 'student', nav: 'aprender', title: 'Curso', view: (p) => TA.catalog.views.course(p) },
    '/leccion': { role: 'student', nav: 'aprender', title: 'Lección y práctica', view: (p) => TA.catalog.views.lesson(p) },
    '/biblioteca-docente': { role: 'teacher', nav: 'planeacion', title: 'Biblioteca para preparar clases', view: () => TA.catalog.views.teacher() },
    '/clase': { role: 'teacher', nav: 'planeacion', title: 'Preparar clase', view: (p) => TA.catalog.views.class(p) },
    '/visual': { role: 'student', nav: 'aprender', title: 'Aprender con dibujos', view: () => TA.visual.view() },
    '/diagnostico': { role: 'student', nav: 'aprender', title: 'Preguntas para empezar', view: () => TA.student.views.diagnostic() },
    '/tutor': { role: 'student', nav: 'tutor', title: 'Tu tutor', view: () => TA.student.views.tutor() },
    '/comprobar': { role: 'student', nav: 'aprender', title: 'Comprueba lo aprendido', view: () => TA.student.views.check() },
    '/progreso': { role: 'student', nav: 'progreso', title: 'Mi progreso', view: () => TA.student.views.progress() },
    '/descargas': { role: 'student', nav: 'descargas', title: 'Estudiar sin internet', view: () => TA.student.views.downloads() },
    '/grupo': { role: 'teacher', nav: 'grupo', title: 'Grupo', view: () => TA.teacher.views.group() },
    '/alertas': { role: 'teacher', nav: 'alertas', title: 'Alertas', view: () => TA.teacher.views.alerts() },
    '/alumnos': { role: 'teacher', nav: 'alumnos', title: 'Avance de cada estudiante', view: (p) => TA.teacher.views.students(p) },
    '/planeacion': { role: 'teacher', nav: 'planeacion', title: 'Planeación', view: () => TA.teacher.views.plan() },
    '/datos': { role: 'teacher', nav: 'datos', title: 'Conexión y datos', view: () => TA.teacher.views.data() },
    '/acerca': { role: null, nav: null, title: 'Acerca del proyecto', view: () => TA.about.view() }
  };

  const HOME = { student: '/inicio', teacher: '/grupo' };

  const NAV = {
    student: [
      { id: 'inicio', href: '#/inicio', icon: 'home', label: 'Inicio' },
      { id: 'aprender', href: '#/aprender', icon: 'book', label: 'Aprender' },
      { id: 'tutor', href: '#/tutor', icon: 'chat', label: 'Tutor' },
      { id: 'progreso', href: '#/progreso', icon: 'chart', label: 'Mi avance' },
      { id: 'descargas', href: '#/descargas', icon: 'download', label: 'Sin Wi-Fi' }
    ],
    teacher: [
      { id: 'grupo', href: '#/grupo', icon: 'grid', label: 'Grupo' },
      { id: 'alertas', href: '#/alertas', icon: 'flag', label: 'Apoyos' },
      { id: 'alumnos', href: '#/alumnos', icon: 'users', label: 'Estudiantes' },
      { id: 'planeacion', href: '#/planeacion', icon: 'calendar', label: 'Mi clase' },
      { id: 'datos', href: '#/datos', icon: 'shield', label: 'Datos' }
    ]
  };

  /** Ruta actual a partir del hash: «#/alumnos/x#seccion» → { path, params, anchor } */
  TA.route = () => {
    const hash = window.location.hash.startsWith('#/') ? window.location.hash.slice(1) : HOME[TA.state.role];
    const [pathPart, anchor = ''] = hash.split('#');
    const segments = pathPart.split('/').filter(Boolean);
    const path = `/${segments[0] || ''}`;
    const def = ROUTES[path];
    if (!def) return { path, view: 'notfound', title: 'Página no encontrada', nav: null, render: notFound, params: {}, anchor };
