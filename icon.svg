# EstudiandoAndo — Despliegue en Vercel

Este directorio contiene el sitio estático listo para publicar.

## Método rápido: Vercel Drop
1. Abre https://vercel.com/drop e inicia sesión.
2. Arrastra `EstudiandoAndo_Listo_para_Vercel.zip` sin modificar su contenido.
3. Selecciona tu cuenta, da un nombre al proyecto y pulsa Deploy.
4. Abre la URL publicada. La portada es `/` y el prototipo independiente también puede verse en `/prototipo.html`.

## Método desde GitHub
1. Coloca el contenido de esta carpeta en la raíz del repositorio, no la carpeta entera dentro de otra.
2. Vercel > Add New > Project > importa el repositorio.
3. Framework Preset: `Other`. Root Directory: `./`. Build Command: vacío (sin compilación). Output Directory: raíz (`.`), no `dist`.
4. Deploy.

## Sin conexión
El sitio registra un service worker y guarda recursos después de abrirse al menos una vez con conexión. Luego permite volver a abrir los materiales almacenados sin internet en ese mismo navegador/dispositivo. El guardado del avance es local. La IA y la sincronización remota son simulaciones.

## Si obtienes 404
Verifica que `index.html` esté en la raíz del contenido servido y que Vercel no esté configurado para buscar `dist`, `build` o una carpeta vacía. Consulta los Build Logs del deployment.
